name: Build LIEF Wheel for Termux (aarch64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-termux-wheel:
    runs-on: ubuntu-latest

    container:
      image: termux/termux-docker:aarch64

    steps:
      - name: Update Termux environment
        run: |
          pkg update -y
          pkg upgrade -y

      - name: Install build dependencies
        run: |
          pkg install -y \
            python \
            python-pip \
            clang \
            cmake \
            ninja \
            make \
            pkg-config \
            git

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build LIEF wheel
        run: |
          pip install --upgrade pip build
          python -m build --wheel
          ls -lh dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: lief-termux-aarch64-wheel
          path: dist/*.whl
