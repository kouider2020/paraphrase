name: Build LIEF Wheels for Termux

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-termux-wheels:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, armv8]
        python-version: [3.8]   # Adjust if you want multiple versions
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip \
              build-essential cmake ninja-build \
              pkg-config unzip curl

      - name: Clone Termux wheel builder
        run: |
          git clone https://github.com/termux-user-repository/pypi-wheel-builder.git

      - name: Build LIEF wheel
        run: |
          cd pypi-wheel-builder
          TERMUX_ARCH=${{ matrix.arch }}
          ./scripts/build-wheel.sh "lief==0.14.1"

      - name: Verify wheel architecture
        run: |
          ls pypi-wheel-builder/dist
          file pypi-wheel-builder/dist/*.whl || true
          unzip -l pypi-wheel-builder/dist/*.whl | grep lief

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: lief-${{ matrix.arch }}-wheel
          path: pypi-wheel-builder/dist/*.whl
