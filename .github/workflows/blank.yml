name: Build LIEF Wheels for Termux

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-termux-wheels:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, armv8]
        python-version: [3.12]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
              pkg-config unzip curl python3-pip

      - name: Build LIEF wheel for Termux
        run: |
          pip install build
          # Force architecture by setting TERMUX_ARCH
          export TERMUX_ARCH=${{ matrix.arch }}
          python -m build --wheel
          ls dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: lief-${{ matrix.arch }}-wheel
          path: dist/*.whl
